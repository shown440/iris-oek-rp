[project]
name = "iris-oek-rp"
version = "1.0.0"
description = "IRIS-OEK-RP: Rhineland-Palatinate compensation-pool (LUWG) WFS harvester -> iris_staging.compensation_sites"
readme = "README.md"
# Brief asks for Python 3.11+. This project targets Python 3.14 everywhere
# (venv, Docker image, CI), which satisfies that requirement.
requires-python = ">=3.14"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S608", "SIM108"]

[tool.ruff.lint.isort]
# Same import style as iris-sample: one import per line.
force-single-line = true
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "integration: needs PostGIS (TEST_DATABASE_URL)",
    "live: hits a real public WFS over the internet (opt-in: -m live)",
]
